name: Build Boing for Mac

# Push a tag like v1.0.0 to build, sign, notarize and publish a release.
# Each release bundles the latest engine zips from useboing.com (scripts/fetch-engine.sh).
# "Run workflow" on the Actions tab makes a signed test build; tick "Publish" to release it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish as a public release (uses the version in package.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch and verify the engine (Apple Silicon + Intel)
        run: bash scripts/fetch-engine.sh

      - name: Prepare the signing certificate (prints no secret values)
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # Certificates exported on recent macOS use AES/PBKDF2 encryption that the
          # runner's keychain tool may not read. Re-wrap it in the classic format with
          # OpenSSL 3, which reads both and says plainly if the password is wrong.
          OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$OSSL" ] || { brew install openssl@3 >/dev/null; OSSL="$(brew --prefix openssl@3)/bin/openssl"; }
          echo "$P12" | tr -d ' \n\r' | base64 -D > $RUNNER_TEMP/orig.p12 2>/dev/null || { echo "::error::MAC_CERT_P12_BASE64 is not valid base64"; exit 1; }
          echo "Certificate file: $(wc -c < $RUNNER_TEMP/orig.p12) bytes"
          if ! "$OSSL" pkcs12 -in $RUNNER_TEMP/orig.p12 -passin env:P12_PASS -nodes -out $RUNNER_TEMP/cert.pem 2>$RUNNER_TEMP/ossl.err; then
            if grep -qi "mac verify\|bad decrypt\|invalid password" $RUNNER_TEMP/ossl.err; then
              echo "::error::MAC_CERT_PASSWORD doesn't open this certificate. Re-enter the password you chose when exporting it."
            else
              echo "::error::The certificate file couldn't be read (it may have been cut off when pasting): $(head -c 200 $RUNNER_TEMP/ossl.err | tr '\n' ' ')"
            fi
            exit 1
          fi
          # The export can hold several identities (e.g. Apple Development too): keep
          # only the Developer ID Application certificate and the key that matches it.
          python3 - "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/devid.pem" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          blocks = re.findall(r"(Bag Attributes.*?-----END [A-Z ]+-----)", text, re.S)
          kid = lambda b: (re.search(r"localKeyID:\s*([0-9A-F ]+)", b) or [None, None])[1]
          cert = next((b for b in blocks if "BEGIN CERTIFICATE" in b and "Developer ID Application" in b), None)
          if not cert:
              sys.exit("no Developer ID Application certificate in the .p12")
          key = next((b for b in blocks if "PRIVATE KEY" in b and kid(b) == kid(cert)), None)
          if not key:
              sys.exit("the Developer ID Application certificate's private key isn't in the .p12")
          open(sys.argv[2], "w").write(key + "\n" + cert + "\n")
          PY
          "$OSSL" pkcs12 -export -legacy -in $RUNNER_TEMP/devid.pem -name "Developer ID Application" -passout env:P12_PASS -out $RUNNER_TEMP/cert.p12
          rm -f $RUNNER_TEMP/devid.pem
          rm -f $RUNNER_TEMP/orig.p12 $RUNNER_TEMP/cert.pem $RUNNER_TEMP/ossl.err
          echo "Certificate ready."

      - name: Check secrets (prints no secret values)
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "Lengths: p12=${#P12} pass=${#P12_PASS} p8=${#P8} keyid=${#KEY_ID} issuer=${#ISSUER}"
          [ -z "$P12" ] && echo "::error::MAC_CERT_P12_BASE64 missing"
          [ -z "$P12_PASS" ] && echo "::error::MAC_CERT_PASSWORD missing"
          [ -z "$P8" ] && echo "::error::APPLE_API_KEY_P8 missing"
          [ -z "$KEY_ID" ] && echo "::error::APPLE_API_KEY_ID missing"
          [ -z "$ISSUER" ] && echo "::error::APPLE_API_ISSUER missing"
          echo "$P8" | grep -q "BEGIN PRIVATE KEY" || echo "::error::APPLE_API_KEY_P8 does not look like a .p8 file (no BEGIN PRIVATE KEY line)"
          security create-keychain -p tmp /tmp/check.keychain
          if security import $RUNNER_TEMP/cert.p12 -k /tmp/check.keychain -P "$P12_PASS" -A >/dev/null 2>&1; then
            echo "Certificate opened with the password."
            ids=$(security find-identity -v -p codesigning /tmp/check.keychain)
            echo "$ids"
            echo "$ids" | grep -q "Developer ID Application" || echo "::error::The .p12 has no 'Developer ID Application' identity. Export that certificate (with its private key) from Keychain."
          else
            echo "::error::Could not open the .p12. Either MAC_CERT_PASSWORD is wrong, or the base64 got cut off when pasting."
          fi
          security delete-keychain /tmp/check.keychain

      - name: Save the App Store Connect API key for notarizing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Put the signing certificate in a build keychain
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$P12_PASS" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12
          security find-identity -v -p codesigning "$KC"

      - name: Build, sign and notarize
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY=~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          set -o pipefail
          if ! npx electron-builder --mac --arm64 --x64 --publish never 2>&1 | tee /tmp/build.log; then
            # Surface the error in the run summary so it is readable without opening the log.
            grep -v '^\s*$' /tmp/build.log | grep -iE 'error|failed|status|message|code' | tail -25 | sed 's/[^[:print:]]//g' | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          fi
          ls -la dist

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG=v$VER
          if gh release view $TAG >/dev/null 2>&1; then
            if gh release view $TAG --json assets -q '.assets[].name' | grep -qx Boing-arm64.dmg; then
              echo "::error::$TAG is already released. Bump the version in package.json first."; exit 1
            fi
            echo "Removing the incomplete $TAG release so it can be rebuilt."
            gh release delete $TAG --yes
          fi
          # Upload everything to a draft first, then publish, so people never see a half-uploaded release.
          gh release create $TAG --draft --target "$GITHUB_SHA" --title "Boing $VER" \
            --notes "Download **Boing-arm64.dmg** for Apple Silicon Macs (M1 and later) or **Boing-x64.dmg** for Intel Macs, open it and drag Boing into Applications. Installed apps update themselves, engine included." \
            dist/Boing-arm64.dmg dist/Boing-x64.dmg dist/*.blockmap \
            dist/Boing-$VER-arm64-mac.zip dist/Boing-$VER-x64-mac.zip dist/latest-mac.yml
          gh release edit $TAG --draft=false --latest

      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Boing-mac
          path: dist/*.dmg
